<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>兔子先生回家记</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    width: 100%; height: 100%;
    background: #1a1a1e;
    font-family: -apple-system, 'Segoe UI', 'PingFang SC', sans-serif;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .scale-wrap {
    width: 1000px;
    height: 640px;
    transform-origin: center center;
    position: relative;
  }
  .computer {
    width: 1000px;
    height: 640px;
    background: #2b2b33;
    border-radius: 14px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 30px 100px rgba(0,0,0,0.7), 0 0 0 8px #141418;
  }
  .screen {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #1e1e26;
  }

  /* ============ 状态栏 ============ */
  .topbar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 34px;
    background: #17171f;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    z-index: 200;
    font-size: 12px;
    color: #6a6a80;
    letter-spacing: 1px;
  }
  .topbar .right { display: flex; gap: 14px; }

  /* ============ 应用栏 ============ */
  .desktop {
    position: absolute;
    top: 34px; left: 0; bottom: 0;
    width: 190px;
    padding: 22px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    border-right: 1px solid #2f2f3a;
    z-index: 5;
  }
  .icon {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 11px;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.18s;
  }
  .icon:hover { background: #2a2a36; }
  .icon:active { transform: scale(0.97); }
  .icon.disabled { opacity: 0.35; }
  .icon.disabled .icon-img { filter: grayscale(0.7); }
  .icon-img {
    width: 42px; height: 42px;
    border-radius: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 3px 10px rgba(0,0,0,0.35);
    position: relative;
    overflow: hidden;
  }
  .icon-label { font-size: 15px; color: #cfcfd8; letter-spacing: 0.5px; }

  /* 微信 */
  .ic-wechat { background: linear-gradient(145deg, #5fd66a, #35b04a); }
  /* Rabbit Book */
  .ic-rabbitbook { background: linear-gradient(145deg, #7d8cff, #4a5ce8); }
  /* 购物 */
  .ic-shopping { background: linear-gradient(145deg, #ffb25e, #e88b2a); }
  /* 打卡程序 */
  .ic-clockin { background: linear-gradient(145deg, #6ad0e0, #2f9fb8); }
  /* 兔兔驿站 */
  .ic-yizhan { background: linear-gradient(145deg, #c88aff, #8a4ae8); }
  /* 邮箱 */
  .ic-mail { background: linear-gradient(145deg, #ff8a8a, #d94f4f); }
  /* 设置（齿轮） */
  .ic-settings { background: linear-gradient(145deg, #9aa4c8, #5a6488); }
  /* 电话（听筒） */
  .ic-phone { background: linear-gradient(145deg, #4ad0a0, #1a9a6a); }
  /* 家（房子） */
  .ic-home { background: linear-gradient(145deg, #ffb88a, #e87a3a); }

  /* ============ 任务栏 ============ */
  .sidebar {
    position: absolute;
    top: 34px; right: 0; bottom: 0;
    width: 250px;
    background: #23232d;
    border-left: 1px solid #2f2f3a;
    padding: 18px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    z-index: 5;
    overflow-y: auto;
  }
  .sidebar::-webkit-scrollbar { width: 4px; }
  .sidebar::-webkit-scrollbar-thumb { background: #3a3a4a; border-radius: 4px; }
  .side-title { font-size: 11px; color: #6a6a80; letter-spacing: 2px; margin-bottom: 9px; }
  .achieve-btn {
    display: flex; align-items: center; justify-content: space-between;
    padding: 11px 14px; background: #2a2a38; border-radius: 10px;
    cursor: pointer; transition: 0.2s; border: 1px solid #333344;
  }
  .achieve-btn:hover { background: #313142; border-color: #44445a; }
  .achieve-btn .left { display: flex; align-items: center; gap: 9px; font-size: 14px; color: #c8c8d4; }
  .achieve-btn .trophy { font-size: 16px; }
  .achieve-btn .count { font-size: 13px; color: #7a7a92; }
  .divider { height: 1px; background: #2f2f3a; }
  .goal-list { display: flex; flex-direction: column; gap: 11px; }
  .goal-item {
    display: flex; gap: 9px; align-items: flex-start;
    font-size: 14px; color: #c8c8d4; line-height: 1.5;
  }
  .goal-item .dot {
    width: 13px; height: 13px; border-radius: 50%;
    border: 2px solid #5a5a72; flex-shrink: 0; margin-top: 3px; transition: 0.3s;
  }
  .goal-item .dot.done { background: #7ec87e; border-color: #7ec87e; }
  .goal-item.done { color: #6a6a80; }
  .goal-item.done .text { text-decoration: line-through; }
  .goal-item .text { flex: 1; }
  .goal-item .sub { display: block; font-size: 12px; color: #6a6a80; margin-top: 3px; line-height: 1.5; }
  .clock { margin-top: auto; text-align: center; color: #4a4a5e; font-size: 13px; letter-spacing: 1px; }

  /* ============ 软件窗口 ============ */
  .win {
    position: absolute; background: #262630; border-radius: 10px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.65); border: 1px solid #3a3a4a;
    display: none; flex-direction: column; overflow: hidden;
    z-index: 20; min-width: 340px; min-height: 260px;
  }
  .win.show { display: flex; }
  .win-bar {
    height: 38px; background: #2f2f3c; display: flex; align-items: center;
    padding: 0 12px; cursor: move; flex-shrink: 0; gap: 8px;
  }
  .win-title { font-size: 14px; color: #cfcfd8; flex: 1; padding-left: 4px; }
  .win-close {
    width: 26px; height: 26px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    color: #8a8a9a; font-size: 17px; cursor: pointer; transition: 0.2s;
  }
  .win-close:hover { background: #d94f4f; color: #fff; }
  .win-body {
    flex: 1; overflow-y: auto; padding: 16px;
    color: #b8b8c4; font-size: 14px; line-height: 1.6;
  }
  .win-body::-webkit-scrollbar { width: 5px; }
  .win-body::-webkit-scrollbar-thumb { background: #3a3a4a; border-radius: 4px; }

  /* ============ 成就面板 ============ */
  .achieve-panel {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(10,10,16,0.75); backdrop-filter: blur(4px);
    display: none; justify-content: center; align-items: center; z-index: 300;
  }
  .achieve-panel.show { display: flex; }
  .panel-box {
    background: #23232d; border: 1px solid #333344; border-radius: 16px;
    width: 460px; max-height: 78%; padding: 24px 22px 22px;
    position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    display: flex; flex-direction: column;
  }
  .panel-box h2 { font-size: 17px; color: #e0e0ea; font-weight: 500; letter-spacing: 2px; margin-bottom: 4px; }
  .panel-box .sub { font-size: 12px; color: #6a6a80; margin-bottom: 16px; }
  .panel-close-x {
    position: absolute; top: 16px; right: 16px; width: 28px; height: 28px;
    border-radius: 8px; display: flex; align-items: center; justify-content: center;
    color: #8a8a9a; font-size: 17px; cursor: pointer; transition: 0.2s;
  }
  .panel-close-x:hover { background: #3a3a4a; color: #fff; }
  .ach-list { display: flex; flex-direction: column; gap: 9px; overflow-y: auto; }
  .ach-list::-webkit-scrollbar { width: 4px; }
  .ach-list::-webkit-scrollbar-thumb { background: #3a3a4a; border-radius: 4px; }
  .ach-row {
    display: flex; gap: 12px; align-items: center;
    padding: 11px 13px; background: #1e1e26; border-radius: 10px;
    border: 1px solid #2a2a36;
  }
  .ach-row.locked { opacity: 0.42; }
  .ach-row .badge {
    width: 36px; height: 36px; border-radius: 9px; background: #3a3a4a;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }
  .ach-row.done .badge { background: linear-gradient(145deg, #ffd76e, #e8a830); }
  .ach-row .name { font-size: 14px; color: #d8d8e2; }
  .ach-row .status { font-size: 11px; color: #5a5a72; margin-left: auto; }
  .ach-row.done .status { color: #ffd76e; }

  /* ============ toast ============ */
  .toast {
    position: absolute; right: 264px; bottom: 24px;
    background: #2a2a38; border: 1px solid #3d3d52;
    border-left: 3px solid #ffd76e; border-radius: 10px;
    padding: 12px 16px; max-width: 290px;
    transform: translateX(340px); opacity: 0;
    transition: all 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 250;
  }
  .toast.show { transform: translateX(0); opacity: 1; }
  .toast .t-title { font-size: 11px; color: #ffd76e; letter-spacing: 1px; margin-bottom: 4px; }
  .toast .t-text { font-size: 13px; color: #d8d8e2; line-height: 1.5; }

  /* ============ 章节动画 ============ */
  .chapter-cover {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: #0a0a10; display: none; flex-direction: column;
    justify-content: center; align-items: center; z-index: 500;
    opacity: 0; transition: opacity 0.9s ease;
  }
  .chapter-cover.show { display: flex; opacity: 1; }
  .chapter-cover .c-num { font-size: 15px; color: #8a8a9a; letter-spacing: 6px; margin-bottom: 14px; }
  .chapter-cover .c-name { font-size: 34px; color: #e8e8f0; letter-spacing: 10px; font-weight: 300; }

  /* ============ 系统弹窗 ============ */
  .sys-popup {
    position: absolute;
    top: 42px;
    left: 200px;
    right: 260px;
    background: #2a2a38;
    border: 1px solid #4a4a6a;
    border-left: 3px solid #7d8cff;
    border-radius: 10px;
    padding: 12px 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    z-index: 260;
    display: none;
    cursor: pointer;
    transition: 0.3s;
  }
  .sys-popup.show { display: block; }
  .sys-popup .sp-title { font-size: 12px; letter-spacing: 1px; margin-bottom: 4px; }
  .sys-popup .sp-text { font-size: 13px; color: #d8d8e2; line-height: 1.5; }

  /* ============ 图片放大弹层 ============ */
  .img-zoom {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(5,5,10,0.9); backdrop-filter: blur(6px);
    display: none; justify-content: center; align-items: center;
    z-index: 400; cursor: pointer;
  }
  .img-zoom.show { display: flex; }
  .img-zoom img {
    max-width: 80%; max-height: 80%;
    border-radius: 14px;
    box-shadow: 0 20px 80px rgba(0,0,0,0.8);
    background: #2a2a36;
  }
  .img-zoom .iz-close {
    position: absolute; top: 20px; right: 24px;
    color: #c8c8d4; font-size: 26px; cursor: pointer;
  }
  .img-zoom .iz-close:hover { color: #fff; }

  /* ============ 微信 ============ */
  .wx-wrap { display: flex; flex-direction: column; height: 100%; }
  .wx-head {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; border-bottom: 1px solid #2f2f3a; flex-shrink: 0;
  }
  .wx-head .wx-name { flex: 1; font-size: 15px; color: #e0e0ea; }
  .wx-logout {
    font-size: 12px; color: #fff; background: #d94f4f;
    padding: 5px 12px; border-radius: 7px; cursor: pointer; transition: 0.2s;
  }
  .wx-logout:hover { background: #e86363; }
  .wx-list { flex: 1; overflow-y: auto; }
  .wx-list::-webkit-scrollbar { width: 5px; }
  .wx-list::-webkit-scrollbar-thumb { background: #3a3a4a; border-radius: 4px; }
  .wx-row {
    display: flex; align-items: center; gap: 11px;
    padding: 12px 14px; cursor: pointer; transition: 0.15s;
    border-bottom: 1px solid #24242e;
  }
  .wx-row:hover { background: #2c2c38; }
  .wx-row .wx-avatar {
    width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; color: #fff; font-weight: 600;
  }
  .wx-row .wx-info { flex: 1; overflow: hidden; }
  .wx-row .wx-row-name { font-size: 14px; color: #d8d8e2; margin-bottom: 3px; }
  .wx-row .wx-preview {
    font-size: 12px; color: #6a6a80; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .wx-row .wx-badge { width: 8px; height: 8px; background: #d94f4f; border-radius: 50%; flex-shrink: 0; }
  .wx-chat { display: flex; flex-direction: column; height: 100%; }
  .wx-chat-head {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; border-bottom: 1px solid #2f2f3a; flex-shrink: 0;
  }
  .wx-back {
    width: 26px; height: 26px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    color: #8a8a9a; font-size: 20px; cursor: pointer; transition: 0.2s;
  }
  .wx-back:hover { background: #3a3a4a; color: #fff; }
  .wx-chat-name { font-size: 15px; color: #e0e0ea; }
  .wx-msgs {
    flex: 1; overflow-y: auto; padding: 16px 14px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .wx-msgs::-webkit-scrollbar { width: 5px; }
  .wx-msgs::-webkit-scrollbar-thumb { background: #3a3a4a; border-radius: 4px; }
  .wx-msg { display: flex; gap: 9px; max-width: 78%; }
  .wx-msg.me { flex-direction: row-reverse; align-self: flex-end; }
  .wx-msg .m-avatar {
    width: 32px; height: 32px; border-radius: 9px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: #fff; font-weight: 600;
  }
  .wx-msg .m-bubble {
    background: #2f2f3c; padding: 9px 12px;
    border-radius: 4px 12px 12px 12px;
    font-size: 13.5px; color: #d8d8e2; line-height: 1.55; word-break: break-word;
  }
  .wx-msg.me .m-bubble {
    background: #3f6d4a; border-radius: 12px 4px 12px 12px; color: #eaffe9;
  }
  .wx-msg.sys {
    align-self: center; max-width: 90%; color: #6a6a80;
    font-size: 12px; background: #23232d; padding: 4px 10px; border-radius: 6px;
  }
  .wx-msg.sys .m-bubble { background: transparent; padding: 0; color: inherit; }
  .wx-file-card {
    background: #26262f; border: 1px solid #3a3a4a; border-radius: 10px;
    padding: 12px 14px; display: flex; align-items: center; gap: 11px;
    cursor: pointer; transition: 0.2s;
  }
  .wx-file-card:hover { border-color: #5a5a72; background: #2c2c38; }
  .wx-file-card.done { border-color: #7ec87e; }
  .wx-file-icon {
    width: 38px; height: 38px; border-radius: 9px; background: #3a3a4a;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; flex-shrink: 0;
  }
  .wx-file-card.done .wx-file-icon { background: #4a7a4a; }
  .wx-file-name { font-size: 13px; color: #d8d8e2; margin-bottom: 3px; }
  .wx-file-sub { font-size: 11px; color: #6a6a80; }
  .wx-send-btn {
    align-self: flex-end;
    background: #3f6d4a; color: #eaffe9;
    padding: 8px 18px; border-radius: 9px;
    font-size: 13px; cursor: pointer; transition: 0.2s;
    margin-top: 4px;
  }
  .wx-send-btn:hover { background: #4a7f57; }

  /* ============ 登录页 ============ */
  .login-page {
    display: flex; flex-direction: column; justify-content: flex-start;
    align-items: center; min-height: 100%; gap: 14px; padding: 24px 30px;
    overflow-y: auto;
  }
  .login-page::-webkit-scrollbar { width: 5px; }
  .login-page::-webkit-scrollbar-thumb { background: #3a3a4a; border-radius: 4px; }
  .login-page .lg-title { font-size: 17px; color: #e0e0ea; letter-spacing: 3px; margin-bottom: 6px; }
  .login-field { width: 100%; max-width: 280px; position: relative; }
  .login-field input {
    width: 100%; padding: 10px 12px; border-radius: 9px;
    border: 1px solid #3a3a4a; background: #1e1e26; color: #e0e0ea;
    font-size: 14px; outline: none; transition: 0.2s;
  }
  .login-field input:focus { border-color: #5a5a72; }
  .login-field input::-ms-reveal,
  .login-field input::-ms-clear { display: none; }
  .login-field input::-webkit-credentials-auto-fill-button,
  .login-field input::-webkit-strong-password-auto-fill-button { display: none; }
  .pwd-eye {
    position: absolute; right: 10px; top: 10px; width: 22px; height: 22px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .pwd-eye .eye-shape {
    width: 16px; height: 10px; border: 1.6px solid #8a8a9a;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; position: relative;
  }
  .pwd-eye .eye-shape::after {
    content: ''; width: 5px; height: 5px; background: #8a8a9a;
    border-radius: 50%; position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
  }
  .pwd-eye.showing .eye-shape { border-color: #c8c8d4; }
  .pwd-eye.showing .eye-shape::after { background: #c8c8d4; }
  .pwd-eye .eye-slash {
    display: none; position: absolute; width: 20px; height: 1.6px;
    background: #8a8a9a; transform: rotate(-45deg);
  }
  .pwd-eye.showing .eye-slash { display: block; }
  .login-field .lg-hint { font-size: 11px; color: #6a6a80; margin-top: 5px; line-height: 1.5; }
  .login-btn {
    width: 100%; max-width: 280px; padding: 10px; border-radius: 9px;
    background: #3f6d4a; color: #eaffe9; font-size: 14px;
    text-align: center; cursor: pointer; transition: 0.2s; margin-top: 4px;
  }
  .login-btn:hover { background: #4a7f57; }
  .login-btn.disabled { background: #3a3a4a; color: #6a6a80; cursor: default; }
  .login-err { font-size: 12px; color: #d94f4f; min-height: 16px; }
  .forget-link {
    font-size: 12px; color: #6a8aff; cursor: pointer;
    text-decoration: underline; margin-top: 2px;
  }
  .forget-link:hover { color: #8a9aff; }

  .arrow-puzzle {
    font-size: 15px; color: #d8d8e2; line-height: 1.9;
    letter-spacing: 3px; background: #1e1e26; border-radius: 8px;
    padding: 10px 14px; border: 1px solid #3a3a4a;
  }

  /* ============ Rabbit Book ============ */
  .rb-wrap { display: flex; flex-direction: column; height: 100%; }
  .rb-head {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-bottom: 1px solid #2f2f3a; flex-shrink: 0;
  }
  .rb-logo { font-size: 15px; color: #8f9bff; letter-spacing: 1px; font-weight: 600; }
  .rb-back {
    width: 34px; height: 34px; border-radius: 9px; display: none;
    align-items: center; justify-content: center; color: #cfd4ff;
    background: #3a3f6a; font-size: 22px; cursor: pointer;
    transition: 0.2s; margin-right: 4px;
  }
  .rb-back:hover { background: #4a5ce8; color: #fff; }
  .rb-back.show { display: flex; }
  .rb-cols { flex: 1; display: flex; overflow: hidden; }
  .rb-left {
    width: 170px; border-right: 1px solid #2f2f3a; padding: 14px;
    flex-shrink: 0; overflow-y: auto;
  }
  .rb-mid { flex: 1; overflow-y: auto; padding: 14px; }
  .rb-right {
    width: 180px; border-left: 1px solid #2f2f3a; padding: 14px;
    flex-shrink: 0; overflow-y: auto;
  }
  .rb-left::-webkit-scrollbar, .rb-mid::-webkit-scrollbar, .rb-right::-webkit-scrollbar { width: 4px; }
  .rb-left::-webkit-scrollbar-thumb, .rb-mid::-webkit-scrollbar-thumb, .rb-right::-webkit-scrollbar-thumb { background: #3a3a4a; border-radius: 4px; }
  .rb-profile-card {
    display: flex; flex-direction: column; align-items: center;
    text-align: center; gap: 8px; padding-bottom: 14px;
    border-bottom: 1px solid #2f2f3a; margin-bottom: 14px;
  }
  .rb-big-avatar {
    width: 64px; height: 64px; border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; color: #fff; font-weight: 600;
  }
  .rb-nick { font-size: 15px; color: #e0e0ea; }
  .rb-acc { font-size: 12px; color: #6a6a80; }
  .rb-bio { font-size: 12px; color: #8a8a9a; line-height: 1.5; }
  .rb-post {
    background: #1e1e26; border: 1px solid #2a2a36;
    border-radius: 12px; padding: 14px; margin-bottom: 12px;
  }
  .rb-post-head { display: flex; align-items: center; gap: 9px; margin-bottom: 9px; }
  .rb-post-avatar {

let currentChapter = null;

function isAppLocked(appId) {
  if (state.chapter !== 3) return false;
  if (appId === 'wechat' || appId === 'rabbitbook') {
    return !state.settings.connected;
  }
  return false;
}

function renderDesktop() {
  const el = document.getElementById('desktop');
  el.innerHTML = '';
  if (!currentChapter) return;
  currentChapter.apps.forEach(id => {
    const a = appMeta[id];
    if (!a) return;
    const locked = isAppLocked(id);
    const d = document.createElement('div');
    d.className = 'icon' + (locked ? ' disabled' : '');
    d.innerHTML = `
      <div class="icon-img ${a.cls}">${a.svg}</div>
      <div class="icon-label">${a.label}</div>
    `;
    d.addEventListener('click', () => {
      if (locked) { onLockedAppClick(id); return; }
      openWindow(a.win);
    });
    el.appendChild(d);
  });
}

function onLockedAppClick(appId) {
  if (appId === 'wechat') {
    state.wx.noNetClicks++;
    if (state.wx.noNetClicks >= 10 && state.chapter === 3 && !state.settings.connected) {
      unlockAchievement('anxious');
    }
  }
  showSysPopup('无网络连接', '请先连接高铁 WiFi', '#7d8cff');
}

function renderGoals() {
  const el = document.getElementById('goalList');
  el.innerHTML = '';
  state.goals.filter(g => !g.hidden).forEach(g => {
    const d = document.createElement('div');
    d.className = 'goal-item' + (g.done ? ' done' : '');
    d.innerHTML = `
      <div class="dot ${g.done ? 'done' : ''}"></div>
      <div class="text">${g.text}${g.sub ? `<span class="sub">${g.sub}</span>` : ''}</div>
    `;
    el.appendChild(d);
  });
}
function addGoal(id) {
  const g = state.goals.find(x => x.id === id);
  if (g) { g.hidden = false; renderGoals(); }
}
function finishGoal(id) {
  const g = state.goals.find(x => x.id === id);
  if (g) { g.done = true; g.hidden = false; renderGoals(); }
}

function renderAchievements() {
  const el = document.getElementById('achList');
  el.innerHTML = '';
  let done = 0;
  state.achievements.forEach(a => {
    if (a.done) done++;
    const d = document.createElement('div');
    d.className = 'ach-row' + (a.done ? ' done' : ' locked');
    d.innerHTML = `
      <div class="badge">${a.done ? '🏆' : '🔒'}</div>
      <div class="name">${a.name}</div>
      <div class="status">${a.done ? '已获得' : ''}</div>
    `;
    el.appendChild(d);
  });
  document.getElementById('achCount').textContent = `${done} / ${state.achievements.length}`;
  document.getElementById('achSub').textContent = `已完成 ${done} / ${state.achievements.length}`;
}
function unlockAchievement(id) {
  const a = state.achievements.find(x => x.id === id);
  if (!a || a.done) return;
  a.done = true;
  renderAchievements();
  showToast('成就达成', a.name);
}

function showToast(title, text) {
  const t = document.getElementById('toast');
  document.getElementById('toastTitle').textContent = title;
  document.getElementById('toastText').textContent = text;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
}

let sysPopupTimer = null;
function showSysPopup(title, text, color, stay) {
  const p = document.getElementById('sysPopup');

function openWindow(id) {
  const w = document.getElementById(id);
  if (!w) return;
  if (state.chapter === 3) {
    if (id === 'win-wechat' && !state.settings.connected) { onLockedAppClick('wechat'); return; }

  }
  w.classList.add('show');

  if (id === 'win-wechat') renderWeChat();

  if (id === 'win-shopping') renderShopping();
  if (id === 'win-clockin') renderClockIn();

  if (id === 'win-mail') renderMail();
  if (id === 'win-settings') renderSettings();
  if (id === 'win-phone') renderPhone();
  if (id === 'win-home') renderHome();
  if (state.chapter === 2 || state.chapter === 3) hideSysPopup();}

function bringToFront(w) { zTop++; w.style.zIndex = zTop; }

/* ==========================================================
   窗口拖动
   ========================================================== */
function getScale() {
  const wrap = document.getElementById('scaleWrap');
  const rect = wrap.getBoundingClientRect();
  return rect.width / 1000;
}
function makeDraggable(bar) {
  const winId = bar.dataset.drag;
  const win = document.getElementById(winId);
  let startX, startY, origX, origY;
  bar.addEventListener('mousedown', (e) => {
    if (e.target.classList.contains('win-close')) return;
    const scale = getScale();
    startX = e.clientX;
    startY = e.clientY;
    origX = win.offsetLeft;
    origY = win.offsetTop;
    document.addEventListener('mousemove', drag);
    document.addEventListener('mouseup', stopDrag);
    function drag(ev) {
      let nx = origX + (ev.clientX - startX) / scale;
      let ny = origY + (ev.clientY - startY) / scale;
      if (ny < 40) ny = 40;
      const maxX = 1000 - win.offsetWidth;
      const maxY = 640 - win.offsetHeight;
      if (nx < 0) nx = 0;
      if (nx > maxX) nx = maxX;
      if (ny > maxY) ny = maxY;
      win.style.left = nx + 'px';
      win.style.top = ny + 'px';
    }
    function stopDrag() {
      document.removeEventListener('mousemove', drag);
      document.removeEventListener('mouseup', stopDrag);
    }
  });
}
document.querySelectorAll('[data-drag]').forEach(makeDraggable);

/* ==========================================================
   缩放
   ========================================================== */
function updateScale() {
  const wrap = document.getElementById('scaleWrap');
  const s = Math.min(window.innerWidth / 1000, window.innerHeight / 640);
  wrap.style.transform = `scale(${s})`;
}
window.addEventListener('resize', updateScale);
updateScale();

function playChapterEnd(num, name, cb) {
  const cover = document.getElementById('chapterCover');
  const numEl = document.getElementById('coverNum');
  const nameEl = document.getElementById('coverName');
  numEl.textContent = num;
  nameEl.textContent = name;
  numEl.style.opacity = '1';
  nameEl.style.opacity = '1';
  cover.style.opacity = '1';
  cover.classList.add('show');
  setTimeout(() => {
    numEl.style.transition = 'opacity 0.5s ease';
    nameEl.style.transition = 'opacity 0.5s ease';
    numEl.style.opacity = '0';
    nameEl.style.opacity = '0';
    setTimeout(() => { if (cb) cb(); }, 1200);
  }, 1800);
}
function playChapterStart(num, name, beforeFade, afterFade) {
  const cover = document.getElementById('chapterCover');
  const numEl = document.getElementById('coverNum');
  const nameEl = document.getElementById('coverName');
  numEl.textContent = num;
  nameEl.textContent = name;
  numEl.style.transition = '';
  nameEl.style.transition = '';
  numEl.style.opacity = '1';
  nameEl.style.opacity = '1';
  cover.style.opacity = '1';
  cover.classList.add('show');
  setTimeout(() => {
    if (beforeFade) beforeFade();
    cover.style.opacity = '0';
    setTimeout(() => {
      cover.classList.remove('show');
      cover.style.opacity = '1';
      numEl.style.opacity = '1';
      nameEl.style.opacity = '1';
      if (afterFade) afterFade();
    }, 900);
  }, 1800);
}

      });

    body.innerHTML = `
      <div class="login-page">
        <div class="lg-title" style="color:#8f9bff;">Rabbit Book</div>
        <div class="login-field">
          <input id="rbAccount" placeholder="账号">
          <div class="lg-hint">提示：${rbData.accountHint}</div>
        </div>

          <input id="rbPassword" placeholder="密码" type="password" style="padding-right:38px;">

        </div>
        ${isCh2 ? `
        <div style="width:100%;max-width:280px;margin-top:6px;">
          <img class="pigpen-img" id="pigpenImg" src="https://img2.tofaka.com/autoupload/f/f5gmj/20260927/dN9e/3000X3000/1790522770446924500.jpg" alt="猪圈密码图">
          <div class="lg-hint" style="text-align:center;margin-top:4px;">点击图片放大</div>
        </div>` : ''}
        <div class="login-err" id="rbErr"></div>
        <div class="login-btn" id="rbBtn" style="background:#4a5ce8;">登 录</div>

      </div>
    `;

      const pig = document.getElementById('pigpenImg');
      if (pig) pig.addEventListener('click', () => openImgZoom(pig.src));
    }
    document.getElementById('rbBtn').addEventListener('click', tryLoginRabbit);
    document.getElementById('rbPassword').addEventListener('keydown', e => {
      if (e.key === 'Enter') tryLoginRabbit();
    });
    document.getElementById('rbEye').addEventListener('click', function() {
      const inp = document.getElementById('rbPassword');
      const showing = inp.type === 'text';
      inp.type = showing ? 'password' : 'text';
      this.classList.toggle('showing', !showing);
    });
    const forget = document.getElementById('rbForget');
    if (forget) {
      if (isCh3) {
        forget.addEventListener('click', () => { rb.forgotMode = true; renderRabbit(); });
      }
      // 第一、二章：点击无反应
    }
    return;
  }

  const isFriend = rb.view === 'friend';
  let profile, posts, backShow;
  if (isFriend) {
    profile = rbData.friends.find(f => f.id === rb.friendId);
    posts = profile ? (profile.posts || []) : [];
    backShow = 'show';
  } else {
    profile = rbData.self;
    posts = profile.posts;
    backShow = '';
  }

  const av = ch.avatars[profile.avatar] || { bg: '#555', ch: '?' };
  let leftHTML = `
    <div class="rb-profile-card">
      <div class="rb-big-avatar" style="background:${av.bg};">${av.ch}</div>
      <div class="rb-nick">${profile.name}</div>
      <div class="rb-acc">@${profile.account}</div>
      ${profile.bio ? `<div class="rb-bio">${profile.bio}</div>` : ''}
    </div>
  `;

  let midHTML = '';
  if (isFriend && profile && profile.locked) {
    midHTML = `<div class="rb-empty">${profile.locked}</div>`;
  } else if (posts.length === 0) {
    midHTML = `<div class="rb-empty">还没有发布任何动态。</div>`;
  } else {
    posts.forEach(p => {
      const liked = rb.likedPosts[p.id];
      let imgHTML = '';
      if (p.img) {
        if (p.img.startsWith('IMGPOST_')) {
          imgHTML = `<!-- 【图】位置：${p.img}，正方形 1:1 -->\n<img class="post-img" src="" alt="" data-imgzoom="${p.id}">`;
        } else {
          imgHTML = `<img class="post-img" src="${p.img}" alt="" data-imgzoom="${p.id}">`;
        }
      }
      let recipeBtn = '';
      if (state.chapter === 3 && p.id === 'r1' && !state.recipeGot) {
        recipeBtn = `<div class="rb-recipe-btn" data-recipe="1">获取配方</div>`;
      } else if (state.chapter === 3 && p.id === 'r1' && state.recipeGot) {
        recipeBtn = `<div class="rb-recipe-btn done">配方已获取</div>`;
      }
      midHTML += `
        <div class="rb-post">
          <div class="rb-post-head">
            <div class="rb-post-avatar" style="background:${av.bg};">${av.ch}</div>
            <div class="rb-post-name">${profile.name}</div>
            <div class="rb-post-time">${p.time}</div>
          </div>
          <div class="rb-post-text">${p.text}</div>
          ${imgHTML}
          <div class="rb-post-foot">
            <div class="like-btn ${liked ? 'liked' : ''}" data-like="${p.id}">
              <span>${liked ? '❤' : '♡'}</span><span>${p.likes + (liked ? 1 : 0)}</span>
            </div>
            ${recipeBtn}
          </div>
        </div>
      `;
    });
  }

  let rightHTML = `<div class="side-title" style="margin-bottom:10px;">好 友</div>`;
  rbData.friends.forEach(f => {
    const fav = ch.avatars[f.avatar] || { bg: '#555', ch: '?' };
    rightHTML += `
      <div class="rb-friend" data-friend="${f.id}">
        <div class="rb-f-avatar" style="background:${fav.bg};">${fav.ch}</div>
        <div class="rb-f-name">${f.name}</div>
      </div>
    `;
  });

  body.innerHTML = `
    <div class="rb-wrap">
      <div class="rb-head">
        <div class="rb-back ${backShow}" id="rbBack">‹</div>
        <div class="rb-logo">Rabbit Book</div>
      </div>
      <div class="rb-cols">
        <div class="rb-left">${leftHTML}</div>
        <div class="rb-mid" id="rbMid">${midHTML}</div>
        <div class="rb-right">${rightHTML}</div>
      </div>
    </div>
  `;

  const back = document.getElementById('rbBack');
  if (back) back.addEventListener('click', () => {
    rb.view = 'home'; rb.friendId = null; renderRabbit();
  });
  body.querySelectorAll('[data-friend]').forEach(el => {
    el.addEventListener('click', () => {
      rb.view = 'friend'; rb.friendId = el.dataset.friend; renderRabbit();
    });
  });
  body.querySelectorAll('[data-like]').forEach(el => {
    el.addEventListener('click', () => {
      const pid = el.dataset.like;
      if (rb.likedPosts[pid]) return;
      rb.likedPosts[pid] = true;
      let post = null;
      if (rb.view === 'friend') {
        const f = rbData.friends.find(x => x.id === rb.friendId);
        if (f && f.posts) post = f.posts.find(p => p.id === pid);
      } else {
        post = rbData.self.posts.find(p => p.id === pid);
      }
      el.classList.add('liked');
      el.innerHTML = `<span>❤</span><span>${post ? post.likes + 1 : ''}</span>`;
      if (rb.friendId === 'xiaobai') unlockAchievement('lively');
    });
  });
  body.querySelectorAll('[data-imgzoom]').forEach(el => {
    el.addEventListener('click', () => {
      const pid = el.dataset.imgzoom;
      openImgZoom(el.src, () => {
        if (state.chapter === 2 && pid === 'n2') unlockAchievement('happy');
      });
    });
  });
  body.querySelectorAll('[data-recipe]').forEach(el => {
    el.addEventListener('click', () => {
      if (state.recipeGot) return;
      state.recipeGot = true;
      el.classList.add('done');
      el.textContent = '配方已获取';
      el.removeAttribute('data-recipe');
      showToast('已获取', '祖传桂花月饼配方');
      if (document.getElementById('win-wechat').classList.contains('show')
          && state.wx.view === 'chat'
          && state.wx.chatWith === 'mom') {
        renderWeChat();
      }
    });
  });
}

function tryLoginRabbit() {
  const acc = document.getElementById('rbAccount').value.trim();
  const pwd = document.getElementById('rbPassword').value.trim();
  const err = document.getElementById('rbErr');
  const rbData = getCh().rb;

  if (state.chapter === 3) {
    state.rb.loginFails++;
    err.textContent = '账号或密码错误';
    if (state.rb.loginFails >= 3) unlockAchievement('insist');
    document.getElementById('rbPassword').value = '';
    return;
  }

  if (acc === rbData.account && pwd === rbData.password) {
    state.rb.logged = true;
    renderRabbit();
    showToast('登录成功', '欢迎回来，兔子先生');
  } else {
    state.rb.loginFails++;
    err.textContent = '账号或密码错误';
    if (state.rb.loginFails >= 3) unlockAchievement('stupid');
    document.getElementById('rbPassword').value = '';
  }
}

function tryForgotRabbit() {
  const acc = document.getElementById('rbForgotAcc').value.trim();

    err.textContent = '账号不存在';
    document.getElementById('rbForgotAcc').value = '';
  }
}

function renderPhone() {
  const body = document.getElementById('phoneBody');
  const ph = state.phone;

  if (ph.tab === 'dial') {
    mainHTML = `
      <div class="ph-dial">
        <div class="ph-dial-input" id="phDialInput"></div>

        </div>
      </div>
    `;
  } else if (ph.tab === 'mine') {
    const av = chapter3Data.avatars[chapter3Data.phoneMine.avatar] || { bg:'#4a5ce8', ch:'兔' };
    mainHTML = `
      <div class="ph-mine">
        <div class="ph-mine-avatar" style="background:${av.bg};">${av.ch}</div>
        <div class="ph-mine-num">${chapter3Data.phoneMine.number}</div>
        <div class="ph-mine-label">我的号码</div>
      </div>
    `;
  } else if (ph.tab === 'contacts') {
    if (ph.callWith) {
      let msgs = '';
      ph.callMsgs.forEach(m => {
        const isMe = m.from === 'me';
        const avKey = isMe ? 'tuzi' : (chapter3Data.contacts.find(c => c.id === ph.callWith) || {}).avatar || 'a';
        const av = chapter3Data.avatars[avKey] || { bg:'#555', ch:'?' };
        msgs += `
          <div class="ph-msg ${isMe ? 'me' : ''}">
            <div class="ph-m-avatar" style="background:${av.bg};">${av.ch}</div>
            <div class="ph-bubble">${m.text}</div>
          </div>
        `;
      });
      if (ph.callDone) msgs += `<div class="ph-ended">— 通话结束 —</div>`;
      let choicesHTML = '';
      if (ph.choiceShown && !ph.callDone) {
        choicesHTML = `
          <div class="ph-choices">
            <div class="ph-choice" data-choice="A">没什么</div>
            <div class="ph-choice" data-choice="B">问问电话号码</div>
          </div>
        `;
      }
      mainHTML = `
        <div class="ph-call">
          <div class="ph-call-head">
            <div class="wx-back" id="phCallBack">‹</div>
            <div class="ph-call-name">${chapter3Data.contacts.find(c => c.id === ph.callWith).name}</div>
          </div>
          <div class="ph-call-body" id="phCallBody">${msgs}</div>
          ${choicesHTML}
        </div>
      `;
    } else {
      let list = '';
      chapter3Data.contacts.forEach(c => {
        const av = chapter3Data.avatars[c.avatar] || { bg:'#555', ch:'?' };
        list += `
          <div class="ph-contact">
            <div class="ph-contact-avatar" style="background:${av.bg};">${av.ch}</div>
            <div class="ph-contact-name">${c.name}</div>
            <div class="ph-call-btn" data-call="${c.id}">拨号</div>
          </div>
        `;
      });
      mainHTML = `<div class="ph-contacts">${list}</div>`;
    }
  }

  body.innerHTML = `
    <div class="ph-wrap">
      <div class="ph-side">
        <div class="ph-tab ${ph.tab==='dial'?'active':''}" data-tab="dial">拨号</div>
        <div class="ph-tab ${ph.tab==='mine'?'active':''}" data-tab="mine">我的</div>
        <div class="ph-tab ${ph.tab==='contacts'?'active':''}" data-tab="contacts">联系人</div>
      </div>
      <div class="ph-main">${mainHTML}</div>
    </div>
  `;
  body.querySelectorAll('[data-tab]').forEach(t => {
    t.addEventListener('click', () => {
      ph.tab = t.dataset.tab;
      ph.callWith = null; ph.callMsgs = []; ph.callDone = false; ph.choiceShown = false;
      renderPhone();
    });
  });
  body.querySelectorAll('[data-call]').forEach(b => {
    b.addEventListener('click', () => startCall(b.dataset.call));
  });
  const back = document.getElementById('phCallBack');
  if (back) back.addEventListener('click', () => {
    ph.callWith = null; ph.callMsgs = []; ph.callDone = false; ph.choiceShown = false;
    renderPhone();
  });
  body.querySelectorAll('[data-choice]').forEach(c => {
    c.addEventListener('click', () => chooseCall(c.dataset.choice));
  });
  const cb = document.getElementById('phCallBody');
  if (cb) cb.scrollTop = cb.scrollHeight;
}
function startCall(contactId) {
  const ph = state.phone;
  const c = chapter3Data.contacts.find(x => x.id === contactId);
  if (!c) return;
  ph.callWith = contactId;
  ph.callMsgs = [{ from: 'other', text: c.dialog.start.text }];
  ph.callDone = false; ph.choiceShown = false;
  renderPhone();
  setTimeout(() => { ph.choiceShown = true; renderPhone(); }, 800);
}
function chooseCall(choice) {
  const ph = state.phone;
  const c = chapter3Data.contacts.find(x => x.id === ph.callWith);
  if (!c) return;
  ph.choiceShown = false;
  const lines = c.dialog[choice];
  let delay = 0;
  lines.forEach(m => {
    setTimeout(() => { ph.callMsgs.push(m); renderPhone(); }, delay);
    delay += 800;
  });
  setTimeout(() => { ph.callDone = true; renderPhone(); }, delay + 300);
}

function onEatCake() {
  const h = state.home;
  if (h.cakeEaten) return;
  h.cakeEaten = true;
  // 显示结局
  const mask = document.getElementById('endingMask');
  const textEl = document.getElementById('endingText');
  let html = '';
  chapter4Data.endingText.forEach(line => {
    if (line === '') html += `<p>&nbsp;</p>`;
    else if (line.indexOf('在外') >= 0 || line.indexOf('在家') >= 0 || line.indexOf('中秋快乐') >= 0) {
      html += `<p class="hl">${line}</p>`;
    } else {
      html += `<p>${line}</p>`;
    }
  });
  textEl.innerHTML = html;
  mask.classList.add('show');
  const btn = document.getElementById('endingBtn');
  btn.classList.remove('disabled');
  btn.textContent = '确认';
  btn.onclick = () => {
    if (btn.classList.contains('disabled')) return;
    btn.classList.add('disabled');
    btn.textContent = '已确认';
    finishGoal('g13');
    // 第四章完
    setTimeout(() => {
      mask.classList.remove('show');
      playChapterEnd('第 四 章', '完', () => {
        // 黑屏保持，出现收尾
        setTimeout(() => {
          document.getElementById('outro').classList.add('show');
          setTimeout(() => {
            // 收尾停留后回封面
            document.getElementById('outro').classList.remove('show');
            backToCover();
          }, 4500);
        }, 800);
      });
    }, 600);
  };
}

/* ==========================================================
   回封面 + 重置
   ========================================================== */
function backToCover() {
  // 重置所有 state
  state.chapter = 0;
  currentChapter = null;
  state.achievements.forEach(a => a.done = false);
  state.wx = { account: 'tuzi', unlocked: false, view: 'list', chatWith: null, noNetClicks: 0 };
  state.rb = { logged: false, view: 'home', friendId: null, loginFails: 0, likedPosts: {}, forgotMode: false, forgotSent: false };
  state.mail = { logged: false, view: 'list', openId: null, readPickup: false };
  state.yz = { pickupDone: false, specialSent: false };
  state.clockin = { off: false, pwdShown: false };
  state.settings = { connected: false, pwdShown: false };
  state.phone = { tab: 'dial', callWith: null, callMsgs: [], callDone: false, choiceShown: false };
  state.home = { unlocked: false, collected: {}, cakeMade: false, cakeEaten: false };
  state.goals = [];
  state.hasFile = false;
  state.reportSent = false;
  state.adSolved = false;
  state.momAskSent = false;
  state.recipeGot = false;
  state.recipeSent = false;

  resetStateForChapter();
  // 清空任务栏、桌面
  document.getElementById('goalList').innerHTML = '';
  document.getElementById('desktop').innerHTML = '';
  renderAchievements();
  updateClock();

  // 显示封面
  const cover = document.getElementById('cover');
  cover.classList.add('show');
  cover.classList.remove('hide');
}

function resetStateForChapter() {
  document.querySelectorAll('.win').forEach(w => w.classList.remove('show'));
  hideSysPopup();
  document.getElementById('imgZoom').classList.remove('show');
  document.getElementById('achievePanel').classList.remove('show');
  document.getElementById('orderDetailMask').classList.remove('show');
  document.getElementById('endingMask').classList.remove('show');
  document.getElementById('outro').classList.remove('show');
}
